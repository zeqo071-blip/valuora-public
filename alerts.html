{% extends 'base.html' %}{% block content %}<section class="page-head"><div><span class="eyebrow">PRICE WATCH</span><h1>Qiymət alertləri</h1><p>Məhsul müəyyən həddə çatanda Valuora xəbərdarlıq yaratsın.</p></div></section><section class="split"><div class="panel"><h2>Yeni alert</h2><form method="post" action="/alerts" class="stack"><label>Məhsul<select name="product_id" required>{% for p in products %}<option value="{{ p.id }}">{{ p.name[:70] }}</option>{% endfor %}</select></label><label>Məqsəd qiymət<input name="target_price" type="number" step="0.01" required placeholder="1000"></label><label>Valyuta<select name="currency"><option>AZN</option><option>USD</option><option>EUR</option></select></label><button class="btn">Alert yarat</button></form></div><div class="panel"><h2>Aktiv alertlər</h2>{% for r in rows %}<div class="alert-row"><div><strong>{{ r.name }}</strong><small>{{ r.target_price }} {{ r.currency }} hədəfi</small></div><form method="post" action="/alerts/delete"><input type="hidden" name="alert_id" value="{{ r.id }}"><button class="iconbtn">×</button></form></div>{% else %}<div class="empty">Hələ alert yoxdur.</div>{% endfor %}</div></section>{% endblock %}
