{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">COLLABORATION</span><h1>Komanda</h1><p>Business plan üçün komanda üzvlərini idarə et.</p></div></div><section class="panel narrow"><form method="post" action="/team" class="stack"><label>Komanda adı<input name="name" value="{{ team.name if team else '' }}" required></label><label>Üzv e-poçtu<input name="email" type="email" placeholder="komanda@example.com"></label><button class="btn">Yadda saxla / üzv əlavə et</button></form></section><section class="panel narrow"><div class="panel-head"><h3>Üzvlər</h3></div>{% for m in members %}<div class="alert-row"><strong>{{ m.email }}</strong><span class="badge">{{ m.role }}</span></div>{% else %}<div class="empty">Hələ komanda üzvü yoxdur.</div>{% endfor %}</section>{% endblock %}
