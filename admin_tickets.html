{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">ADMIN SUPPORT</span><h1>Dəstək biletləri</h1><p>Bütün istifadəçi müraciətləri.</p></div></div><section class="panel">{% for t in tickets %}<div class="ticket"><div><strong>{{ t.subject }}</strong><small>{{ t.email }} · {{ t.created_at[:16].replace('T',' ') }}</small><p class="muted">{{ t.message }}</p></div><form method="post" action="/admin/ticket"><input type="hidden" name="ticket_id" value="{{ t.id }}"><select name="status"><option {% if t.status=='open' %}selected{% endif %}>open</option><option {% if t.status=='pending' %}selected{% endif %}>pending</option><option {% if t.status=='closed' %}selected{% endif %}>closed</option></select><button class="btn">Yenilə</button></form></div>{% else %}<div class="empty">Bilet yoxdur.</div>{% endfor %}</section>{% endblock %}
