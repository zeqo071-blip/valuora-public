{% extends 'base.html' %}{% block content %}<section class="page-head"><div><span class="eyebrow">NOTIFICATION CENTER</span><h1>Bildirişlər</h1><p>Qiymət, analiz və sistem hadisələri.</p></div></section><section class="panel notification-list">{% for n in rows %}<article><div class="notif-dot"></div><div><strong>{{ n.title }}</strong><p>{{ n.message }}</p><small>{{ n.created_at[:16].replace('T',' ') }}</small></div></article>{% else %}<div class="empty">Yeni bildiriş yoxdur.</div>{% endfor %}</section>{% endblock %}
