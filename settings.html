{% extends 'base.html' %}{% block content %}<section class="page-head"><div><span class="eyebrow">CONTROL ROOM</span><h1>Ayarlar</h1><p>Valuora görünüşünü və bildiriş davranışını fərdiləşdir.</p></div></section><section class="panel narrow"><form method="post" class="settings-form"><label>Görünüş<select name="theme"><option value="dark" {% if settings.theme=='dark' %}selected{% endif %}>Dark</option><option value="light" {% if settings.theme=='light' %}selected{% endif %}>Light</option></select></label><label>Əsas valyuta<select name="currency"><option>AZN</option><option>USD</option><option>EUR</option></select></label><label class="check"><input type="checkbox" name="email_alerts" value="1" {% if settings.email_alerts %}checked{% endif %}> Alert bildirişləri aktiv olsun</label><label class="check"><input type="checkbox" name="compact_mode" value="1" {% if settings.compact_mode %}checked{% endif %}> Kompakt görünüş</label><button class="btn">Ayarları saxla</button></form></section>{% endblock %}
