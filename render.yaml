services:
  - type: web
    name: valuora-public
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: VALUORA_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: VALUORA_DB
        value: /var/data/valuora.db
    disk:
      name: valuora-data
      mountPath: /var/data
      sizeGB: 1
