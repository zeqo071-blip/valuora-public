services:
  - type: web
    name: valuora-public
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: VALUORA_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: VALUORA_DB
        value: /tmp/valuora.db
