{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">ADMIN CONTROL</span><h1>İstifadəçilər</h1><p>Hesablar, planlar və rollar.</p></div></div><section class="panel"><div class="table"><div class="tr th"><span>E-poçt</span><span>Plan</span><span>Analiz</span><span>Rol</span><span>Əməl</span></div>{% for u in users %}<div class="tr"><span><strong>{{ u.email }}</strong><small>{{ u.full_name }}</small></span><span class="badge">{{ u.plan }}</span><span>{{ u.analyses }}</span><span>{{ u.role }}</span><span><form method="post" action="/admin/user-role"><input type="hidden" name="user_id" value="{{ u.id }}"><input type="hidden" name="role" value="{{ 'user' if u.role=='admin' else 'admin' }}"><button class="btn ghost">Rol dəyiş</button></form></span></div>{% endfor %}</div></section>{% endblock %}
